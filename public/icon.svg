<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Indigo to Purple-Pink -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="40%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </radialGradient>
    
    <!-- Bubble Gradient: Sleek Semi-transparent White Glow -->
    <linearGradient id="bubble-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.95" />
    </linearGradient>

    <!-- Globe Grid Gradient -->
    <linearGradient id="globe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base App Background (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg-grad)" />

  <!-- Main Chat Bubble with Shadow -->
  <g filter="url(#shadow)">
    <!-- Chat Bubble Shape -->
    <path d="M 120 140 
             C 120 110, 140 90, 180 90 
             L 332 90 
             C 372 90, 392 110, 392 140 
             L 392 280 
             C 392 310, 372 330, 332 330 
             L 220 330 
             L 150 380 
             C 140 387, 130 380, 130 370 
             L 130 330 
             C 120 330, 120 310, 120 300 
             Z" 
          fill="url(#bubble-grad)" />
  </g>

  <!-- Globe & Network Details inside the Bubble -->
  <g transform="translate(256, 210) scale(1.1)">
    <!-- Globe Core -->
    <circle r="64" fill="none" stroke="url(#globe-grad)" stroke-width="8" />
    
    <!-- Horizontal Equator & Latitudes -->
    <ellipse rx="64" ry="24" fill="none" stroke="url(#globe-grad)" stroke-width="5" stroke-dasharray="2 2" opacity="0.5" />
    <ellipse rx="64" ry="0.1" fill="none" stroke="url(#globe-grad)" stroke-width="6" />
    
    <!-- Longitudes -->
    <ellipse rx="28" ry="64" fill="none" stroke="url(#globe-grad)" stroke-width="6" />
    <ellipse rx="52" ry="64" fill="none" stroke="url(#globe-grad)" stroke-width="3" opacity="0.3" />
    <line x1="0" y1="-64" x2="0" y2="64" stroke="url(#globe-grad)" stroke-width="6" />

    <!-- Connected Message Nodes -->
    <circle cx="-45" cy="-25" r="8" fill="#3b82f6" />
    <circle cx="45" cy="25" r="8" fill="#ec4899" />
    <circle cx="10" cy="-50" r="10" fill="#06b6d4" />
    
    <!-- Small Connection Lines -->
    <line x1="-45" y1="-25" x2="10" y2="-50" stroke="#3b82f6" stroke-width="3" opacity="0.7" />
    <line x1="45" y1="25" x2="10" y2="-50" stroke="#ec4899" stroke-width="3" opacity="0.7" />
  </g>
</svg>
